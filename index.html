<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>NEXUS TOOLBOX</title>
<style>
:root{--bg:#070914;--panel:#0d1221;--panel2:#11182b;--line:#26314b;--txt:#eef4ff;--muted:#7e8ba8;--cyan:#4deaff;--purple:#9b6cff;--pink:#ff4fd8;--green:#54f5a5}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0%,#17204a 0,#070914 35%),#070914;color:var(--txt);font-family:Inter,system-ui,Arial;min-height:100vh}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(#fff00006 1px,transparent 1px),linear-gradient(90deg,#fff00006 1px,transparent 1px);background-size:36px 36px}
header{padding:22px 18px 12px;max-width:1100px;margin:auto}.brand{font-weight:900;letter-spacing:3px;font-size:25px}.brand span{color:var(--cyan);text-shadow:0 0 18px #4deaff88}.sub{color:var(--muted);font-size:12px;margin-top:5px}
.wrap{max-width:1100px;margin:auto;padding:10px 15px 35px}.back{display:none;position:absolute;left:15px;top:17px;border:1px solid #2b3a58;background:#0c1425;color:#dceaff;border-radius:12px;padding:8px 12px;font-weight:800;cursor:pointer;box-shadow:0 0 18px #4deaff12}.back:hover{border-color:var(--cyan);color:var(--cyan)}
body.tool-open header{padding-left:95px}
body.tool-open .back{display:block}
body.tool-open .sub{display:none}
body.tool-open .brand{font-size:20px}
body.tool-open #homeView{display:none}
body.tool-open #toolView{display:block!important}
.search{width:100%;background:#0c1120dd;border:1px solid #26314b;color:white;border-radius:16px;padding:14px 16px;outline:0}.search:focus{border-color:var(--cyan);box-shadow:0 0 22px #4deaff22}
.tabs{display:flex;gap:8px;overflow:auto;padding:12px 0}.tab{white-space:nowrap;border:1px solid var(--line);background:#0d1323;color:#9aa7c1;padding:9px 13px;border-radius:12px}.tab.active{color:#00151b;background:var(--cyan);border-color:var(--cyan);box-shadow:0 0 20px #4deaff55}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:11px}.card{border:1px solid #1c2740;background:linear-gradient(145deg,#11182a,#0a0f1d);padding:16px;border-radius:18px;cursor:pointer;transition:.2s}.card:hover{transform:translateY(-3px);border-color:#4deaff88;box-shadow:0 10px 30px #0008,0 0 20px #4deaff15}.ico{font-size:27px}.card b{display:block;margin-top:9px}.card small{color:var(--muted)}
.panel{display:block;margin-top:16px;background:linear-gradient(145deg,#10172a,#090e1b);border:1px solid #26314b;border-radius:25px;padding:18px;box-shadow:0 20px 60px #0009}.panel.show{display:block}.close{float:right;border:1px solid var(--line);background:#151d31;color:white;border-radius:10px;padding:7px 10px}
.panel h2{margin:2px 0 16px}.field{background:#080d19;border:1px solid #27324b;color:white;border-radius:12px;padding:12px;width:100%;margin:5px 0 10px}.btn{border:0;background:linear-gradient(135deg,var(--cyan),#39a8ff);color:#001018;font-weight:800;padding:11px 15px;border-radius:12px;cursor:pointer}.result{margin-top:10px;padding:13px;background:#080d19;border:1px solid #202b43;border-radius:12px;white-space:pre-wrap;word-break:break-word}
.calc{max-width:430px;margin:auto}.calc-screen{height:145px;border:1px solid #273653;border-radius:22px;background:radial-gradient(circle at 80% 20%,#19384d,#080d18 58%);padding:18px;display:flex;flex-direction:column;justify-content:end;text-align:right;overflow:hidden;box-shadow:inset 0 0 35px #4deaff0b}.calc-mini{height:25px;color:#71819f;font-size:14px;overflow:hidden}.calc-display{font-size:43px;font-weight:300;white-space:nowrap;overflow:auto;scrollbar-width:none}.calc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}.key{height:62px;border-radius:18px;border:1px solid #27334c;background:linear-gradient(145deg,#151d31,#0d1322);color:#eef4ff;font-size:21px;box-shadow:0 5px 12px #0005;cursor:pointer}.key:active{transform:scale(.94)}.key.op{color:var(--cyan);background:#102231}.key.eq{background:linear-gradient(135deg,#4deaff,#8c6cff);color:#041017;border:0}.key.fn{color:#b7c2d9}.key.zero{grid-column:span 2}.history{margin-top:12px;color:#7e8ba8;font-size:12px;text-align:center}
footer{text-align:center;color:#59657f;padding:25px;font-size:11px}
@media(max-width:500px){header{padding-top:17px}.grid{grid-template-columns:repeat(2,1fr)}.card{min-height:105px}.calc-display{font-size:37px}.key{height:58px}}
</style>
</head>
<body>
<header><button id="backBtn" class="back" onclick="goHome()">‹ MENU</button><div class="brand">NEXUS <span>TOOLBOX</span></div><div class="sub">FUTURISTIC UTILITY SYSTEM • 40+ TOOLS</div></header>
<div id="homeView" class="wrap">
<input id="search" class="search" placeholder="⌕  Search tools...">
<div class="tabs"><button class="tab active" data-cat="all">ALL</button><button class="tab" data-cat="math">CALCULATE</button><button class="tab" data-cat="text">TEXT</button><button class="tab" data-cat="convert">CONVERT</button><button class="tab" data-cat="time">TIME</button><button class="tab" data-cat="random">RANDOM</button><button class="tab" data-cat="other">OTHER</button></div>
<div id="grid" class="grid"></div>
</div>
<div id="toolView" class="wrap" style="display:none">
<div id="panel" class="panel show"></div>
</div>
<footer>NEXUS TOOLBOX • SINGLE HTML • BROWSER POWERED</footer>
<script>
const tools=[
["calc","⌗","Calculator","Standard calculator","math"],["percent","%","Percentage","Calculate percentages","math"],["bmi","⚖","BMI","Body mass index","math"],["age","◷","Age Calculator","Calculate age","math"],["tip","$","Tip & Split","Split a bill","math"],["discount","◇","Discount","Final price calculator","math"],["interest","₿","Interest","Simple interest","math"],["gcd","÷","GCD & LCM","Number tools","math"],
["upper","Aa","Case Converter","Upper / lower case","text"],["count","01","Text Counter","Words & characters","text"],["reverse","↶","Reverse","Reverse text","text"],["remove","✦","Deduplicate","Remove duplicate lines","text"],["slug","↗","Slug Maker","URL slug generator","text"],["base64","⌘","Base64","Encode / decode","text"],["json","{}","JSON Format","Format JSON","text"],["findreplace","⌕","Find & Replace","Replace text","text"],["sort","↕","Sort Lines","Sort lines","text"],
["temp","°","Temperature","C / F / K","convert"],["length","↔","Length","Length converter","convert"],["weight","⚖","Weight","Weight converter","convert"],["speed","➜","Speed","Speed converter","convert"],["area","▱","Area","Area converter","convert"],["volume","◇","Volume","Volume converter","convert"],["data","▤","Data","B / KB / MB / GB","convert"],
["timer","◴","Timer","Countdown timer","time"],["stopwatch","⏱","Stopwatch","Precision stopwatch","time"],["countdown","⌛","Countdown","Countdown to date","time"],["clock","◉","Digital Clock","Live clock","time"],
["url","↗","URL Encode","Encode / decode URL","other"],["password","⚿","Password","Random password","other"],["color","◈","Color Picker","Pick a color","other"],["qrcode","▦","QR Code","QR generator","other"],["uuid","ID","UUID","Unique ID","other"],["timestamp","TS","Timestamp","Unix timestamp","other"],["lorem","¶","Lorem","Dummy text","other"],["notes","✎","Quick Notes","Local notes","other"],["palette","✺","Palette","Random colors","other"],
["randomnum","✣","Random Number","Random integer","random"],["coin","◐","Coin Flip","Heads or tails","random"],["dice","⚄","Dice Roll","Roll a die","random"],["choice","?","Random Choice","Pick one","random"]
];
const $=x=>document.getElementById(x),grid=$("grid"),panel=$("panel"),search=$("search");
function render(cat="all",q=""){grid.innerHTML="";tools.filter(t=>(cat=="all"||t[4]==cat)&&t.slice(1,4).join(" ").toLowerCase().includes(q)).forEach(t=>{let d=document.createElement("div");d.className="card";d.innerHTML=`<div class=ico>${t[1]}</div><b>${t[2]}</b><small>${t[3]}</small>`;d.onclick=()=>openTool(t[0]);grid.appendChild(d)})}
render();
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));b.classList.add("active");render(b.dataset.cat,search.value.toLowerCase())});
search.oninput=()=>render(document.querySelector(".tab.active").dataset.cat,search.value.toLowerCase());

function openTool(id){
document.body.classList.add("tool-open");
panel.innerHTML=toolHTML(id);
panel.classList.add("show");
init(id);
}
const I=(id,p,type="text")=>`<input class=field id="${id}" placeholder="${p}" type="${type}">`;
const A=(id,p)=>`<textarea class=field id="${id}" placeholder="${p}"></textarea>`;
function toolHTML(id){
if(id=="calc")return `<div class=calc><h2>⌗ Calculator</h2><div class=calc-screen><div id=expr class=calc-mini></div><div id=display class=calc-display>0</div></div><div class=calc-grid>
<button class="key fn" onclick="C()">AC</button><button class="key fn" onclick="sign()">±</button><button class="key fn" onclick="press('%')">%</button><button class="key op" onclick="press('÷')">÷</button>
<button class=key onclick="press('7')">7</button><button class=key onclick="press('8')">8</button><button class=key onclick="press('9')">9</button><button class="key op" onclick="press('×')">×</button>
<button class=key onclick="press('4')">4</button><button class=key onclick="press('5')">5</button><button class=key onclick="press('6')">6</button><button class="key op" onclick="press('-')">−</button>
<button class=key onclick="press('1')">1</button><button class=key onclick="press('2')">2</button><button class=key onclick="press('3')">3</button><button class="key op" onclick="press('+')">+</button>
<button class="key zero" onclick="press('0')">0</button><button class=key onclick="press('.')">.</button><button class="key eq" onclick="equals()">=</button></div><div class=history>Standard calculator • Keyboard supported</div></div>`;
if(id=="percent")return `<h2>% Percentage</h2>${I("a","Nilai","number")}${I("b","Persen %","number")}<button class=btn onclick="out.innerText=a.value*b.value/100">Calculate</button><div id=out class=result></div>`;
if(id=="bmi")return `<h2>⚖ BMI</h2>${I("w","Weight (kg)","number")}${I("h","Height (cm)","number")}<button class=btn onclick="let x=w.value/(h.value/100)**2;out.innerText='BMI: '+x.toFixed(2)">Calculate</button><div id=out class=result></div>`;
if(id=="age")return `<h2>◷ Age Calculator</h2>${I("dob","Birth date","date")}<button class=btn onclick="let d=new Date(dob.value),n=new Date(),x=n.getFullYear()-d.getFullYear();if(n<new Date(n.getFullYear(),d.getMonth(),d.getDate()))x--;out.innerText=x+' years old'">Calculate</button><div id=out class=result></div>`;
if(id=="tip")return `<h2>$ Tip & Split</h2>${I("bill","Bill","number")}${I("tip","Tip %","number")}${I("people","People","number")}<button class=btn onclick="let x=+bill.value*(1+(+tip.value||0)/100);out.innerText='Total: '+x.toFixed(2)+'\\nPer person: '+(x/(people.value||1)).toFixed(2)">Calculate</button><div id=out class=result></div>`;
if(id=="discount")return `<h2>◇ Discount</h2>${I("p","Original price","number")}${I("d","Discount %","number")}<button class=btn onclick="out.innerText='Save: '+(p.value*d.value/100).toFixed(2)+'\\nFinal: '+(p.value-p.value*d.value/100).toFixed(2)">Calculate</button><div id=out class=result></div>`;
if(id=="upper")return `<h2>Aa Case Converter</h2>${A("txt","Your text...")}<button class=btn onclick="out.innerText=txt.value.toUpperCase()">UPPERCASE</button> <button class=btn onclick="out.innerText=txt.value.toLowerCase()">lowercase</button><div id=out class=result></div>`;
if(id=="count")return `<h2>01 Text Counter</h2>${A("txt","Your text...")}<button class=btn onclick="out.innerText='Characters: '+txt.value.length+'\\nWords: '+(txt.value.trim()?txt.value.trim().split(/\\s+/).length:0)">Count</button><div id=out class=result></div>`;
if(id=="reverse")return `<h2>↶ Reverse</h2>${A("txt","Your text...")}<button class=btn onclick="out.innerText=[...txt.value].reverse().join('')">Reverse</button><div id=out class=result></div>`;
if(id=="remove")return `<h2>✦ Deduplicate</h2>${A("txt","One item per line...")}<button class=btn onclick="out.innerText=[...new Set(txt.value.split(/\\r?\\n/))].filter(Boolean).join('\\n')">Clean</button><div id=out class=result></div>`;
if(id=="slug")return `<h2>↗ Slug Maker</h2>${I("txt","Title...")}<button class=btn onclick="out.innerText=txt.value.toLowerCase().normalize('NFD').replace(/[\\u0300-\\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')">Generate</button><div id=out class=result></div>`;
if(id=="base64")return `<h2>⌘ Base64</h2>${A("txt","Text...")}<button class=btn onclick="out.innerText=btoa(unescape(encodeURIComponent(txt.value)))">Encode</button> <button class=btn onclick="try{out.innerText=decodeURIComponent(escape(atob(txt.value)))}catch(e){out.innerText='Invalid Base64'}">Decode</button><div id=out class=result></div>`;
if(id=="json")return `<h2>{ } JSON Format</h2>${A("txt","JSON...")}<button class=btn onclick="try{out.innerText=JSON.stringify(JSON.parse(txt.value),null,2)}catch(e){out.innerText='Invalid JSON'}">Format</button><div id=out class=result></div>`;
if(id=="findreplace")return `<h2>⌕ Find & Replace</h2>${A("txt","Text...")}${I("f","Find")}${I("r","Replace with")}<button class=btn onclick="out.innerText=txt.value.split(f.value).join(r.value)">Replace</button><div id=out class=result></div>`;
if(id=="sort")return `<h2>↕ Sort Lines</h2>${A("txt","One line per item...")}<button class=btn onclick="out.innerText=txt.value.split(/\\r?\\n/).filter(Boolean).sort((a,b)=>a.localeCompare(b,undefined,{numeric:true})).join('\\n')">Sort</button><div id=out class=result></div>`;
if(["temp","length","weight","speed","area","volume","data"].includes(id))return converter(id);
if(id=="timer")return `<h2>◴ Timer</h2>${I("sec","Seconds","number")}<div id=out class=result>Ready</div><button class=btn onclick="startTimer()">START</button> <button class=btn onclick="clearInterval(window.tt)">STOP</button>`;
if(id=="stopwatch")return `<h2>⏱ Stopwatch</h2><div id=out class=result style="font-size:32px;text-align:center">00:00.00</div><button class=btn onclick="swStart()">START</button> <button class=btn onclick="swStop()">STOP</button> <button class=btn onclick="swReset()">RESET</button>`;
if(id=="clock")return `<h2>◉ Digital Clock</h2><div id=out class=result style="font-size:40px;text-align:center"></div>`;
if(id=="countdown")return `<h2>⌛ Countdown</h2>${I("dt","Target date & time","datetime-local")}<button class=btn onclick="cd()">START</button><div id=out class=result></div>`;
if(id=="url")return `<h2>↗ URL Encode</h2>${A("txt","URL / text...")}<button class=btn onclick="out.innerText=encodeURIComponent(txt.value)">Encode</button> <button class=btn onclick="out.innerText=decodeURIComponent(txt.value)">Decode</button><div id=out class=result></div>`;
if(id=="password")return `<h2>⚿ Password Generator</h2>${I("len","Length","number")}<button class=btn onclick="let c='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*_-',s='';for(let i=0;i<(+len.value||16);i++)s+=c[Math.random()*c.length|0];out.innerText=s">GENERATE</button><div id=out class=result></div>`;
if(id=="color")return `<h2>◈ Color Picker</h2><input id=cp type=color value="#4deaff" class=field><div id=out class=result>#4deaff</div>`;
if(id=="qrcode")return `<h2>▦ QR Code</h2>${I("txt","Text / URL...")}<button class=btn onclick="out.innerHTML='<img style=max-width:220px src=https://api.qrserver.com/v1/create-qr-code/?size=220x220&data='+encodeURIComponent(txt.value)+'>'">GENERATE</button><div id=out class=result>QR membutuhkan internet.</div>`;
if(id=="uuid")return `<h2>ID UUID Generator</h2><button class=btn onclick="out.innerText=crypto.randomUUID()">GENERATE</button><div id=out class=result></div>`;
if(id=="timestamp")return `<h2>TS Timestamp</h2><button class=btn onclick="out.innerText=Date.now()+'\\n'+new Date().toISOString()">NOW</button><div id=out class=result></div>`;
if(id=="lorem")return `<h2>¶ Lorem Generator</h2><button class=btn onclick="out.innerText='Lorem ipsum dolor sit amet, consectetur adipiscing elit. '.repeat(8)">GENERATE</button><div id=out class=result></div>`;
if(id=="notes")return `<h2>✎ Quick Notes</h2>${A("txt","Notes...")}<button class=btn onclick="localStorage.nexusNotes=txt.value;out.innerText='Saved ✓'">SAVE</button> <button class=btn onclick="txt.value=localStorage.nexusNotes||''">LOAD</button><div id=out class=result></div>`;
if(id=="palette")return `<h2>✺ Random Palette</h2><button class=btn onclick="out.innerHTML=Array.from({length:5},()=>{let c='#'+(Math.random()*16777215|0).toString(16).padStart(6,'0');return '<span style=\"display:inline-block;padding:25px 8px;margin:3px;border-radius:10px;background:'+c+'\">'+c+'</span>'}).join('')">GENERATE</button><div id=out class=result></div>`;
if(id=="randomnum")return `<h2>✣ Random Number</h2>${I("min","Min","number")}${I("max","Max","number")}<button class=btn onclick="out.innerText=Math.floor(Math.random()*(+max.value-+min.value+1))+(+min.value)">RANDOMIZE</button><div id=out class=result></div>`;
if(id=="coin")return `<h2>◐ Coin Flip</h2><button class=btn onclick="out.innerText=Math.random()<.5?'HEADS':'TAILS'">FLIP</button><div id=out class=result></div>`;
if(id=="dice")return `<h2>⚄ Dice Roll</h2><button class=btn onclick="out.innerText='🎲 '+(Math.random()*6|0+1)">ROLL</button><div id=out class=result></div>`;
if(id=="choice")return `<h2>? Random Choice</h2>${A("txt","One choice per line...")}<button class=btn onclick="let a=txt.value.split(/\\r?\\n/).filter(Boolean);out.innerText=a.length?a[Math.random()*a.length|0]:'No choices'">CHOOSE</button><div id=out class=result></div>`;
}
function init(id){if(id=="clock")window.clock=setInterval(()=>out.innerText=new Date().toLocaleTimeString("id-ID"),500);if(id=="color")cp.oninput=()=>out.innerText=cp.value}
function goHome(){
clearInterval(window.clock); clearInterval(window.tt); clearInterval(window.cdi); swStop();
document.body.classList.remove("tool-open");
panel.classList.remove("show");
}
function converter(id){let c={temp:["Temperature",["C","F","K"]],length:["Length",["m","km","cm","ft","in"]],weight:["Weight",["kg","g","lb","oz"]],speed:["Speed",["km/h","mph"]],area:["Area",["m²","km²","ft²"]],volume:["Volume",["L","mL","gal"]],data:["Data",["B","KB","MB","GB"]]}[id];return `<h2>↔ ${c[0]}</h2>${I("v","Value","number")}<div style=display:flex;gap:8px><select id=from class=field>${c[1].map(x=>`<option>${x}</option>`)}</select><select id=to class=field>${c[1].map(x=>`<option>${x}</option>`)}</select></div><button class=btn onclick="convert('${id}')">CONVERT</button><div id=out class=result></div>`}
function convert(id){let v=+window.v.value,f=from.value,t=to.value;if(id=="temp"){let c=f=="C"?v:f=="F"?(v-32)*5/9:v-273.15;out.innerText=(t=="C"?c:t=="F"?c*9/5+32:c+273.15).toFixed(5)}else{let map={length:{m:1,km:1000,cm:.01,ft:.3048,in:.0254},weight:{kg:1,g:.001,lb:.453592,oz:.0283495},speed:{"km/h":1,mph:1.609344},area:{"m²":1,"km²":1e6,"ft²":.092903},volume:{L:1,mL:.001,gal:3.78541},data:{B:1,KB:1024,MB:1048576,GB:1073741824}}[id];out.innerText=(v*map[f]/map[t]).toFixed(6)}}
let cur="",last="",op=null,reset=false;function press(x){if(reset){cur="";reset=false}if(x=="%"){cur=String(+cur/100);show();return}if("+-×÷".includes(x)){op=x;last=cur||"0";cur="";$("expr").innerText=last+" "+x;return}if(x=="."&&cur.includes("."))return;cur+=x;show()}function show(){$("display").innerText=cur||"0"}function C(){cur="";last="";op=null;$("expr").innerText="";show()}function sign(){if(cur)cur=String(-+cur);show()}function equals(){if(!op)return;let b=+cur,a=+last,r=op=="+"?a+b:op=="-"?a-b:op=="×"?a*b:a/b;$("expr").innerText=last+" "+op+" "+cur+" =";cur=String(r);op=null;reset=true;show();if(a===111&&b===111&&r===222)setTimeout(openSecret,180)}document.addEventListener("keydown",e=>{if(!panel.classList.contains("show"))return;let k=e.key;if(/[0-9.]/.test(k))press(k);else if("+-*/".includes(k))press(k=="*"?"×":k=="/"?"÷":k);else if(k=="Enter"||k=="=")equals();else if(k=="Escape")C()});
function startTimer(){let n=+sec.value||0;clearInterval(window.tt);out.innerText=n;window.tt=setInterval(()=>{out.innerText=--n;if(n<=0){clearInterval(tt);out.innerText="TIME UP"}} ,1000)}
let swt=null,base=0;function swStart(){if(swt)return;base=Date.now();swt=setInterval(()=>{let x=Date.now()-base;out.innerText=new Date(x).toISOString().slice(14,19)+"."+String(x%100).padStart(2,"0")},10)}function swStop(){clearInterval(swt);swt=null}function swReset(){swStop();out.innerText="00:00.00"}
function cd(){clearInterval(window.cdi);window.cdi=setInterval(()=>{let x=new Date(dt.value)-Date.now();if(x<=0){out.innerText="DONE";clearInterval(cdi);return}let s=x/1000|0;out.innerText=Math.floor(s/86400)+"d "+Math.floor(s%86400/3600)+"h "+Math.floor(s%3600/60)+"m "+s%60+"s"},1000)}
</script>
<style>
#secretLayer{display:none;position:fixed;inset:0;z-index:9999;background:#05070d}
#secretLayer.open{display:block}
#secretFrame{width:100%;height:100%;border:0;display:block;background:#05070d}
#secretBack{position:fixed;z-index:10000;left:12px;top:12px;border:1px solid #26314b;background:#0d1221;color:#eef4ff;border-radius:12px;padding:8px 12px;font-weight:800;cursor:pointer}
#secretBack:hover{border-color:#4deaff;color:#4deaff}
</style>
<div id="secretLayer">
  <button id="secretBack" type="button" onclick="closeSecret()">‹ KEMBALI</button>
  <iframe id="secretFrame" title="rahasia.html"></iframe>
